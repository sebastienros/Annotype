name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

# A newer push to the same branch or PR supersedes older runs; Actions runners are shared across the account.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        NUGET_PACKAGES: ${{ matrix.os == 'ubuntu-latest' && '/mnt/nuget/packages' || format('{0}/.nuget/packages', github.workspace) }}
        NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache
        NUGET_SCRATCH: ${{ github.workspace }}/.nuget/scratch
        NUGET_PLUGINS_CACHE_PATH: ${{ github.workspace }}/.nuget/plugins

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Prepare Linux NuGet package directory
      if: runner.os == 'Linux'
      shell: bash
      run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$NUGET_PACKAGES"
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        global-json-file: global.json
        check-latest: false
    - name: Install minimum supported compiler host
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: tests/Annotype.Packaging.Tests/MinimumSdk/global.json
        check-latest: false
    - name: Restore
      run: dotnet restore -p:Configuration=Release -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Test
      run: dotnet test --configuration Release --no-build

    - name: Pack preview packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      run: dotnet pack --output artifacts --configuration Release --no-build -p:VersionSuffix=preview-${{ github.run_number }} -p:ContinuousIntegrationBuild=True

    - name: Push preview packages to Feedz
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: |
        set -euo pipefail
        for package in artifacts/*.nupkg; do
          dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/annotype/nuget/index.json --skip-duplicate
        done

  # Experimental: Native AOT publish of the sample host with explicit registration.
  aot:
    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        global-json-file: global.json
        check-latest: false
    - name: Publish sample host with Native AOT
      run: dotnet publish samples/Payments.Host --configuration Release --runtime linux-x64 -p:AnnotypeSampleAot=true -p:TreatWarningsAsErrors=true --output artifacts/aot
    - name: Run sample host
      shell: bash
      run: |
        set -euo pipefail
        output="$(artifacts/aot/Payments.Host)"
        echo "$output"
        grep -q "PaymentPlugin: Name=payments, Priority=10" <<< "$output"
