<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Annotype">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tag" x1="132" y1="0" x2="394" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="string" x1="108" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <mask id="eyelet" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <circle cx="180" cy="256" r="20" fill="#000000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="40" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" rx="40" fill="url(#gloss)"/>

  <!-- Logo mark, translated/scaled into the left area -->
  <g transform="translate(70 36) scale(0.56)" filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <!-- String tying the tag on -->
    <path d="M112 200 C130 150 164 150 180 256" stroke="url(#string)" stroke-width="12.96"/>
    <!-- Annotation tag -->
    <path d="M198 150 L370 150 Q394 150 394 174 L394 338 Q394 362 370 362 L198 362 L134 256 Z"
          fill="url(#tag)" stroke="url(#tag)" stroke-width="16" mask="url(#eyelet)"/>
    <!-- The type it describes -->
    <path d="M242 206 L344 206 M293 206 L293 312" stroke="#4F46E5" stroke-width="32.4"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Anno<tspan fill="#C7D2FE">type</tspan></text>
  <text x="404" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="400" fill="#E0E7FF" letter-spacing="0.5">Move invariants from instances to types</text>
</svg>
