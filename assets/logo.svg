<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Annotype">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tag" x1="132" y1="0" x2="394" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="string" x1="108" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <mask id="eyelet" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <circle cx="180" cy="256" r="20" fill="#000000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#gloss)"/>

  <g filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <!-- String tying the tag on -->
    <path d="M112 200 C130 150 164 150 180 256" stroke="url(#string)" stroke-width="12"/>
    <!-- Annotation tag -->
    <path d="M198 150 L370 150 Q394 150 394 174 L394 338 Q394 362 370 362 L198 362 L134 256 Z"
          fill="url(#tag)" stroke="url(#tag)" stroke-width="16" mask="url(#eyelet)"/>
    <!-- The type it describes -->
    <path d="M242 206 L344 206 M293 206 L293 312" stroke="#4F46E5" stroke-width="30"/>
  </g>
</svg>
